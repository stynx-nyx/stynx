name: DEVAI gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: devai-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  governed-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stynx
          POSTGRES_USER: stynx
          POSTGRES_PASSWORD: stynx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stynx -d stynx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: '1'
      DATABASE_URL: postgresql://stynx:stynx@127.0.0.1:5432/stynx
      STYNX_DATABASE_URL: postgresql://stynx:stynx@127.0.0.1:5432/stynx
      STYNX_TEST_PG_HOST: 127.0.0.1
      STYNX_TEST_PG_PORT: '5432'
      STYNX_TEST_PG_USER: stynx
      STYNX_TEST_PG_PASSWORD: stynx
      STRYKER_INCREMENTAL: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          cache: pnpm
      - name: Restore mutation cache
        id: mutation-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/*/reports/stryker-incremental.json
            packages-web/*/reports/stryker-incremental.json
          key: stryker-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tools/stryker/**', 'tools/repo-config/test-policy.json', 'packages/*/package.json', 'packages/*/stryker*', 'packages/*/vitest*', 'packages/*/tsconfig*.json', 'packages/*/src/**', 'packages/*/test/**', 'packages/*/tests/**', 'packages-web/*/package.json', 'packages-web/*/stryker*', 'packages-web/*/vitest*', 'packages-web/*/tsconfig*.json', 'packages-web/*/src/**', 'packages-web/*/test/**', 'packages-web/*/tests/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stryker-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tools/stryker/**', 'tools/repo-config/test-policy.json', 'packages/*/package.json', 'packages/*/stryker*', 'packages/*/vitest*', 'packages/*/tsconfig*.json', 'packages/*/src/**', 'packages/*/test/**', 'packages/*/tests/**', 'packages-web/*/package.json', 'packages-web/*/stryker*', 'packages-web/*/vitest*', 'packages-web/*/tsconfig*.json', 'packages-web/*/src/**', 'packages-web/*/test/**', 'packages-web/*/tests/**') }}-
      - name: Install exact workspace
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DEVAI_REPO_TOKEN || github.token }}
        run: |
          pnpm install --frozen-lockfile
      - name: Install browser prerequisite
        run: pnpm --filter @stynx-nyx/reference-web exec playwright install --with-deps chromium
      - name: Resolve exact affected base
        id: base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base_sha="$PR_BASE_SHA"
          if [ -z "$base_sha" ]; then base_sha="$PUSH_BEFORE_SHA"; fi
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          git merge-base --is-ancestor "$base_sha" HEAD
          printf 'sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
      - name: Verify bindings and trace
        run: |
          corepack pnpm exec devai doctor --repo-root . --format json
          corepack pnpm devai:trace:verify
      - name: Plan and execute affected closure
        run: |
          corepack pnpm exec devai check --affected --task-plan --base "${{ steps.base.outputs.sha }}" --as-role inspector --format json
          corepack pnpm exec devai check --affected --run --base "${{ steps.base.outputs.sha }}" --task-timeout-ms 18000000 --as-role inspector --write --format json
      - name: Execute local and RC closures
        run: |
          corepack pnpm exec devai check --local --run --task-timeout-ms 18000000 --as-role inspector --write --format json
          corepack pnpm exec devai check --rc --run --task-timeout-ms 18000000 --as-role inspector --write --format json
      - name: Prove deterministic inventory
        run: |
          corepack pnpm exec devai sense inventory --slice all --trace law/trace.json --format json | jq -S '.result.value' > "$RUNNER_TEMP/inventory-1.json"
          corepack pnpm exec devai sense inventory --slice all --trace law/trace.json --format json | jq -S '.result.value' > "$RUNNER_TEMP/inventory-2.json"
          diff -u "$RUNNER_TEMP/inventory-1.json" "$RUNNER_TEMP/inventory-2.json"
      - name: Verify evidence chain
        run: corepack pnpm exec devai evidence verify --scope chain --show-head --repo-root . --format json
      - name: Report DEVAI failure diagnostics
        if: failure()
        run: |
          diagnostic_root=.devai/state/check-cache/v1/diagnostics
          if [ ! -d "$diagnostic_root" ]; then
            echo "DEVAI did not materialize a diagnostic directory."
            exit 0
          fi
          find "$diagnostic_root" -type f -name '*.json' -print0 \
            | sort -z \
            | while IFS= read -r -d '' diagnostic; do
                echo "::group::$diagnostic"
                jq . "$diagnostic"
                echo '::endgroup::'
              done
      - name: Save mutation cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/*/reports/stryker-incremental.json
            packages-web/*/reports/stryker-incremental.json
          key: ${{ steps.mutation-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: devai-gate-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .devai/state/check-cache/v1/diagnostics/
            .devai/state/check-cache/v1/receipts/
            .devai/state/check-cache/v1/results/
            packages/*/reports/stryker-incremental.json
            packages-web/*/reports/stryker-incremental.json
            record/proofs/chain.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
