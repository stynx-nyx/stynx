# Declarative main-branch protection baseline.
#
# This file is the repository-owned policy record. Apply it through the
# repository settings API, Terraform, or a repository-settings action when that
# automation is available.
branches:
  - name: main
    protection:
      # Owner decision, 2026-09-05: admins are intentionally NOT enforced on
      # main. With a two-owner CODEOWNERS set, enforcing admins made the
      # code-owner review requirement unsatisfiable for either owner's own
      # work. Both admins can bypass required reviews and required checks on
      # this branch. Recorded here so declared and live posture agree.
      enforce_admins: false
      required_linear_history: true
      required_conversation_resolution: true
      allow_force_pushes: false
      allow_deletions: false
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
      required_status_checks:
        strict: true
        contexts:
          - semantic-pr-title
          - install
          - lint
          - typecheck
          - migration-lint
          - unit-tests
          - integration-tests
          - stynx-tier-gate
          - build (ubuntu-latest)
          - reference-web-e2e
          - package-policy
          - dependency-audit
