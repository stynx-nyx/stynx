# Declarative main-branch protection baseline.
#
# This file is the repository-owned policy record. Apply it through the
# repository settings API, Terraform, or a repository-settings action when that
# automation is available.
branches:
  - name: main
    protection:
      # Owner decision, 2026-09-05: admins are intentionally NOT enforced on
      # main. With a two-owner CODEOWNERS set, enforcing admins made the
      # code-owner review requirement unsatisfiable for either owner's own
      # work. Both admins can bypass required reviews and required checks on
      # this branch. Recorded here so declared and live posture agree.
      enforce_admins: false
      required_linear_history: true
      required_conversation_resolution: true
      allow_force_pushes: false
      allow_deletions: false
      # Owner decision, 2026-09-12, made definitive 2026-09-27
      # (ADR-BRANCH-PROTECTION-0001): main requires no approving review and no
      # code-owner review. The repository is maintained by one person and GitHub
      # never counts a pull request author's own approval. Every merge still
      # goes through a pull request with all required status checks (strict).
      required_pull_request_reviews:
        required_approving_review_count: 0
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
      # Owner decision, 2026-09-27 (ADR-DEVAI-ADOPTION-0006): unit, integration,
      # tier-gate, build, and reference-web E2E execution moved into the signed
      # local RC closure. verified-local-rc is the remote gate for all of it;
      # audit.yml keeps the weekly remote recalibration.
      required_status_checks:
        strict: true
        contexts:
          - semantic-pr-title
          - install
          - lint
          - typecheck
          - migration-lint
          - verified-local-rc
          - package-policy
          - dependency-audit
