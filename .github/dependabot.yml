# Option D policy, owner decision 2026-07-10: security always-on; version
# updates grouped ~quarterly; see align/STATUS-2026-07-09.md
#
# NOTE ON "QUARTERLY": Dependabot has no native quarterly schedule interval.
# We approximate the owner's requested quarterly cadence for version updates
# with a monthly schedule plus a 90-day cooldown (cooldown.default-days).
# `cooldown` is a GA Dependabot feature; if it is rejected by any local
# validator, verify its effect after merge via this repo's Dependabot logs
# (Insights > Dependency graph > Dependabot > <ecosystem> > Recent update
# jobs).
#
# Security updates are always-on and ungrouped: open-pull-requests-limit
# only throttles version-update PRs, it does not restrict security PRs.
# Repo-level "automated security fixes" must also be enabled (done via the
# API, not this file).
#
# This repo was previously paused (open-pull-requests-limit: 0 on every
# entry) during a billing/lockfile incident; this change restores normal
# operation under Option D and preserves all pre-existing directory/
# ecosystem entries.
#
# pnpm workspace rule (2026-09-11): the root npm entry is the ONLY npm entry.
# Every workspace member (packages/*, packages-web/*, reference/*, test/*,
# domain/*, tools/*, docs/site) shares the single root pnpm-lock.yaml, and
# Dependabot updates all of their manifests plus that lockfile from the root
# job. Per-directory npm entries treat each directory as a standalone project,
# find no lockfile there, and emit manifest-only PRs that always fail
# `pnpm install --frozen-lockfile` (ERR_PNPM_OUTDATED_LOCKFILE). Do not add
# them back.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 90
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      majors:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 90
    open-pull-requests-limit: 1
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
